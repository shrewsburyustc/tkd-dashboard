<!doctype html>
<!--
  star.html — the public Star testing family registration page (/star/<code>).
  Why it exists: families open their school's link or QR code to register a candidate for a Star
  testing (rulebook v0.93–v0.107, v0.510; contract 0006 §8.4). It is another page in the same Vite
  build as the staff dashboard (index.html), but only while the Star build switch is on
  (VITE_STAR_TESTING, vite.config.js) — the live build has no Star page until then. It shares none
  of the dashboard's code; React draws the form inside the empty <div id="root"> below, starting
  from src/star-register/main.jsx.
  public/_redirects serves this page for every /star/<code> address, and public/_headers gives it
  the same strict security policy as Color Belt's /register page.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Star testing registration</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/star-register/main.jsx"></script>
  </body>
</html>
