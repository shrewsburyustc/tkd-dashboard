<!doctype html>
<!--
  index.html — the single HTML page the whole app lives in.
  Why it exists: the browser loads this file first. React then draws every screen
  inside the empty <div id="root"> below, starting from src/main.jsx.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the phone bottom bar respect the iPhone home-indicator area -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>U.S. Taekwondo Center</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
