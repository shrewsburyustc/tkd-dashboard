<!doctype html>
<!--
  star-closed.html — what a Star testing family link (/star/<code>) shows while the Star family
  form is NOT in the build (the Star build switch VITE_STAR_TESTING is off — the live site until
  Star goes live).
  Why it exists: without it, /star/<code> would fall through to the staff dashboard's sign-in page.
  This plain page has no script and no Star code at all; vite.config.js (starRedirects) points
  /star/* here only while the switch is off. Its look copies the family pages' white header strip
  (rulebook v0.106) in plain CSS. public/_headers gives it the same strict security policy as the
  other public pages (no scripts are needed, so none are allowed beyond that policy).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Star testing registration</title>
    <style>
      html, body { margin: 0; background: #f7f7f5; color: #1f1f1f; font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      header { background: #fff; border-bottom: 1px solid #e5e5e2; }
      .in { max-width: 560px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-sizing: border-box; }
      .in img { width: 52px; height: 52px; flex: none; }
      .school { font-size: 15px; font-weight: 500; line-height: 1.25; }
      .kind { font-size: 13px; color: #6b6b6b; }
      main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; box-sizing: border-box; }
      .box { background: #fff; border: 1px solid #e5e5e2; border-radius: 8px; padding: 16px; font-size: 15px; }
      h1 { font-size: 18px; font-weight: 500; margin: 0 0 4px; }
      p { margin: 0; }
    </style>
  </head>
  <body>
    <header>
      <div class="in">
        <img src="/logo.png" width="52" height="52" alt="" />
        <div>
          <div class="school">Jae H. Jeong's U.S. Taekwondo Center</div>
          <div class="kind">Star testing registration</div>
        </div>
      </div>
    </header>
    <main>
      <div class="box">
        <h1>This registration isn’t open yet</h1>
        <p>Please ask at the front desk.</p>
      </div>
    </main>
  </body>
</html>
