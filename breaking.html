<!doctype html>
<!--
  breaking.html — the public Board breaking sign-up page (/breaking/<code>).
  Why it exists: families open an event's link or QR code from the school to register one student for
  Board breaking and, for Card, pay with Square (rulebook v1.300–v1.304, contract 0051 §5). It is another
  page in the same Vite build as the staff dashboard (index.html), the Color Belt form (register.html)
  and the Camps form (camp.html) but shares none of the dashboard's code; React draws the form inside the
  empty <div id="root"> below, starting from src/breaking/main.jsx.
  public/_redirects serves this page for every /breaking/<code> address and public/_headers gives it
  the strict security policy (those two files are changed by the Domain session, not here).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Board breaking sign-up</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/breaking/main.jsx"></script>
  </body>
</html>
