<!--
  Event money reports (one report per event) and paid dates on every roster: mockups BEFORE building
  (Jeffrey's rule: new things are drawn first). Four pictures:
    ER1  where the report lives (three choices) and who sees it
    ER2  one camp's report at PC 1280, tablet 820, phone 390 and small phone 320, plus the other layout
    ER3  a Star testing event on Both schools
    PD1  the paid date on the Camps, Board Breaking and Black Belt rosters
  Amber dashed outline = what is new. Amber text = a proposal to confirm. Sample data only (made-up names).
  Open with #ER1, #ER2, #ER3 or #PD1 at the end of the address to see one picture alone.
  Source: docs/Finance/Event reports/tools/er-mockups.src.html — built into one self-contained file by build.mjs.
-->
<style>

/*ICONS*/

main{max-width:1700px}
.shot{width:1660px}
.row2{flex-wrap:nowrap}

<body>
<main>
<h1 class="doc">Event money reports · paid dates on rosters — mockups before building</h1>
<p class="lead">Nothing is built yet. Each picture shows what is new inside an amber dashed outline. Sample data only.</p>
<div id="screens"></div>
</main>
<script>
// ===================== helpers =====================
const money = (n) => (n < 0 ? '−$' : '$') + Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const H = { pc: 800, tab: 1180, ph: 844, sm: 640 };
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WDAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dt = (iso) => new Date(iso + 'T12:00:00');
const md = (iso) => `${MONTHS[dt(iso).getMonth()]} ${dt(iso).getDate()}`;
const wmd = (iso) => `${WDAY[dt(iso).getDay()]}, ${md(iso)}`;
const p = (n) => `${n} payment${n === 1 ? '' : 's'}`;
const touch = (d) => d !== 'pc';

function shell(d, o) {
  const { section = 'camps', loc = 'Both', body = '', av = 'JB', chip = false } = o;
  const nav = [['home','Home','home'],['certificate','Testing','testing'],['tent','Camps','camps'],['clock','Schedule','schedule'],['calendar-month','Calendar','calendar'],['address-book','Prospects','prospects'],['hammer','Board breaking','breaking'],['report-money','Finance','finance']];
  const locs = d === 'pc' || d === 'tab' ? [['Worcester','Worcester'],['Shrewsbury','Shrewsbury'],['Both','Both']] : [['Worcester','Worc.'],['Shrewsbury','Shrew.'],['Both','Both']];
  const locHtml = `<div class="loc">${locs.map(([k, l], i) => `<span class="${k === loc ? 'on' : ''}">${i === 0 && (d === 'pc' || d === 'tab') ? '<i class="ti ti-map-pin"></i>' : ''}${l}</span>`).join('')}</div>`;
  const chipHtml = chip ? `<span class="chipHidden"><i class="ti ti-eye-off"></i>${d === 'ph' || d === 'sm' ? '' : 'Payments hidden'}</span>` : '';
  if (d === 'ph' || d === 'sm') {
    const phNav = [['home','Home','home'],['calendar-month','Calendar','calendar'],['address-book','Prospects','prospects'],['menu-2','More','more']];
    return `<div class="phshell" style="min-height:${o.minH ?? (H[d] - 12)}px"><div class="topbar">${locHtml}<span class="grow"></span>${chipHtml}<span class="avatar">${av}</span></div>
      <div class="content" style="position:relative">${body}</div>
      <div class="phbar">${phNav.map(([i, l, id]) => `<a class="${id === 'more' ? 'on' : ''}"><i class="ti ti-${i}"></i>${l}</a>`).join('')}</div></div>`;
  }
  const rail = d === 'pc'
    ? `<nav class="rail">${nav.map(([i, l, id]) => `<a class="${id === section ? 'on' : ''}"><i class="ti ti-${i}"></i></a>`).join('')}</nav>`
    : `<nav class="rail-t">${nav.slice(0, 8).map(([i, l, id]) => `<a class="${id === section ? 'on' : ''}"><i class="ti ti-${i}"></i>${l.length > 9 ? l.split(' ')[0] : l}</a>`).join('')}</nav>`;
  return `<div class="app" style="min-height:${o.minH ?? (H[d] - (d === 'pc' ? 2 : 12))}px">${rail}<div class="app-col"><div class="topbar"><span class="grow"></span>${chipHtml}${locHtml}<span class="avatar">${av}</span></div><div class="content">${body}</div></div></div>`;
}
const dev = (d, o) => `<div class="dev d-${d} ${touch(d) ? 'touch' : ''}">${shell(d, o)}</div>`;
const cap = (t) => `<div class="cap">${t}</div>`;

// ===================== the report =====================
// A payment: day, t (time), name, school, m (Cash / Check / Card), amt (negative = refund), by, state ('counted' | 'undone' | 'edited'), was (edited from), what
const counted = (r) => r.state !== 'undone';
function sum(rows, f = () => true) { return rows.filter((r) => counted(r) && f(r)).reduce((t, r) => t + r.amt, 0); }
function cnt(rows, f = () => true) { return rows.filter((r) => counted(r) && f(r)).length; }
const METHODS = ['Cash', 'Check', 'Card'];

function cards(rows) {
  const ins = (r) => r.amt > 0;
  const refunds = rows.filter((r) => counted(r) && r.amt < 0);
  const c = (icon, label, m) => {
    const f = m ? (r) => ins(r) && r.m === m : ins;
    return `<div class="card"><div class="l"><i class="ti ti-${icon}"></i>${label}</div><div class="n">${money(sum(rows, f))}</div><div class="s">${p(cnt(rows, f))}</div></div>`;
  };
  return `<div class="cards">${c('sum', 'Total taken')}${c('cash', 'Cash', 'Cash')}${c('receipt', 'Check', 'Check')}${c('credit-card', 'Card', 'Card')}</div>
    <div class="hint" style="margin:-4px 0 16px">${refunds.length ? `Refunded ${money(sum(rows, (r) => r.amt < 0))} · ${refunds.length} refund${refunds.length === 1 ? '' : 's'} · ` : ''}<b style="color:var(--text)">Net ${money(sum(rows))}</b></div>`;
}
function schoolBoxes(rows) {
  const box = (s) => {
    const f = (r) => r.school === s;
    const ins = (r) => f(r) && r.amt > 0;
    return `<div class="card"><div class="l"><i class="ti ti-map-pin"></i>${s}</div><div class="n">${money(sum(rows, f))}</div>
      <div class="meta">${p(cnt(rows, ins))} · Cash ${money(sum(rows, (r) => ins(r) && r.m === 'Cash'))} · Check ${money(sum(rows, (r) => ins(r) && r.m === 'Check'))} · Card ${money(sum(rows, (r) => ins(r) && r.m === 'Card'))}</div></div>`;
  };
  return `<div class="sch">${box('Worcester')}${box('Shrewsbury')}</div>`;
}
const tagFor = (r) => r.state === 'undone' ? ' <span class="tag neutral">Undone</span>' : r.state === 'edited' ? ' <span class="tag neutral">Edited</span>' : '';
const subFor = (r) => r.state === 'undone' ? '<div class="sub small">Undone by Jeffrey · not counted</div>' : r.state === 'edited' ? `<div class="sub small">Was ${money(r.was)} · edited by Jeffrey</div>` : '';
const schTag = (r, both) => both ? `<span class="sch-tag">${r.school}</span>` : '';

// The payments of one day, grouped Cash / Check / Card / Refunds (Finance's own grouping, v0.807 + v0.209 "Own group")
function dayLines(d, rows, both, forCol) {
  const groups = [...METHODS.map((m) => ({ name: m, rows: rows.filter((r) => r.amt > 0 && r.m === m) })), { name: 'Refunds', rows: rows.filter((r) => r.amt < 0) }].filter((g) => g.rows.length);
  const head = (g) => { const c = g.rows.filter(counted); return `${g.name} <span class="sub" style="font-weight:400">· ${p(c.length)} · ${money(c.reduce((t, r) => t + r.amt, 0))}</span>`; };
  if (d === 'ph' || d === 'sm') {
    return groups.map((g) => `<div class="pgrp">${head(g)}</div>` + g.rows.map((r) => `<div class="pc"><div><span class="${r.state === 'undone' ? 'strike' : ''}">${r.name}</span>${tagFor(r)}${schTag(r, both)}<div class="sub small">${r.t}${forCol ? ' · ' + r.what : ''} · ${r.by}</div>${subFor(r)}</div><div class="r"><span class="${r.state === 'undone' ? 'strike' : ''}">${money(r.amt)}</span></div></div>`).join('')).join('');
  }
  const cols = (d === 'tab' ? 4 : 5) + (forCol ? 1 : 0);
  return `<table><thead><tr><th style="width:84px">Time</th><th>${'Student'}</th>${forCol ? '<th>For</th>' : ''}${both ? '<th style="width:110px">School</th>' : ''}<th class="r" style="width:100px">Amount</th>${d === 'pc' ? '<th style="width:140px;padding-left:24px">Recorded by</th>' : ''}</tr></thead><tbody>${groups.map((g) => `<tr class="grp"><td colspan="${cols + (both ? 1 : 0)}">${head(g)}</td></tr>` + g.rows.map((r) => `<tr><td class="sub">${r.t}</td><td><span class="${r.state === 'undone' ? 'strike' : ''}">${r.name}</span>${tagFor(r)}${subFor(r)}</td>${forCol ? `<td class="sub">${r.what}</td>` : ''}${both ? `<td class="sub">${r.school}</td>` : ''}<td class="r"><span class="${r.state === 'undone' ? 'strike' : ''}">${money(r.amt)}</span></td>${d === 'pc' ? `<td class="sub" style="padding-left:24px">${r.by}</td>` : ''}</tr>`).join('')).join('')}</tbody></table>`;
}

function byDay(rows) {
  const days = [...new Set(rows.map((r) => r.day))].sort();
  return days.map((day) => ({ day, rows: rows.filter((r) => r.day === day) }));
}

// Layout B (recommended): one row per day, tap a day to open its payments
function dayTable(d, rows, o = {}) {
  const { both = true, open = null, forCol = false, qTable = false } = o;
  const days = byDay(rows);
  const ins = (r) => r.amt > 0;
  if (d === 'ph' || d === 'sm') {
    return `<div class="${qTable ? 'q' : ''}" style="padding:2px">${days.map(({ day, rows: rs }) => {
      const isOpen = day === open;
      const parts = METHODS.map((m) => [m, sum(rs, (r) => ins(r) && r.m === m)]).filter(([, v]) => v).map(([m, v]) => `${m} ${money(v)}`).join(' · ');
      const ref = sum(rs, (r) => r.amt < 0);
      return `<div class="dcard ${isOpen ? 'open' : ''}"><div class="hd"><div><b>${wmd(day)}</b><div class="sub small">${p(cnt(rs))}${parts ? ' · ' + parts : ''}${ref ? ' · Refunded ' + money(ref) : ''}</div></div><div style="text-align:right;white-space:nowrap"><b>${money(sum(rs))}</b><div class="sub"><i class="ti ti-chevron-${isOpen ? 'up' : 'down'}"></i></div></div></div>${isOpen ? `<div class="bd">${dayLines(d, rs, both, forCol)}</div>` : ''}</div>`;
    }).join('')}<div class="dcard"><div class="hd" style="background:var(--surface)"><b>All days</b><b>${money(sum(rows))}</b></div></div></div>`;
  }
  const wide = d === 'pc';
  const head = `<tr><th></th><th>Day</th><th class="r">Payments</th><th class="r">Cash</th><th class="r">Check</th><th class="r">Card</th>${wide ? '<th class="r">Refunds</th>' : ''}<th class="r">Day total</th></tr>`;
  const money0 = (v) => (v ? money(v) : '<span class="sub">—</span>');
  const body = days.map(({ day, rows: rs }) => {
    const isOpen = day === open;
    return `<tr class="dayrow2 ${isOpen ? 'open' : ''}"><td class="chev"><i class="ti ti-chevron-${isOpen ? 'down' : 'right'}"></i></td><td><b style="font-weight:500">${wmd(day)}</b></td><td class="r">${cnt(rs, ins)}</td><td class="r">${money0(sum(rs, (r) => ins(r) && r.m === 'Cash'))}</td><td class="r">${money0(sum(rs, (r) => ins(r) && r.m === 'Check'))}</td><td class="r">${money0(sum(rs, (r) => ins(r) && r.m === 'Card'))}</td>${wide ? `<td class="r">${money0(sum(rs, (r) => r.amt < 0))}</td>` : ''}<td class="r"><b style="font-weight:500">${money(sum(rs))}</b></td></tr>` +
      (isOpen ? `<tr class="expand"><td colspan="${wide ? 8 : 7}"><div class="inner">${dayLines(d, rs, both, forCol)}</div></td></tr>` : '');
  }).join('');
  const tot = `<tr class="total"><td></td><td>All days</td><td class="r">${cnt(rows, ins)}</td><td class="r">${money(sum(rows, (r) => ins(r) && r.m === 'Cash'))}</td><td class="r">${money(sum(rows, (r) => ins(r) && r.m === 'Check'))}</td><td class="r">${money(sum(rows, (r) => ins(r) && r.m === 'Card'))}</td>${wide ? `<td class="r">${money0(sum(rows, (r) => r.amt < 0))}</td>` : ''}<td class="r">${money(sum(rows))}</td></tr>`;
  return `<table class="dtable ${qTable ? 'q' : ''}"><thead>${head}</thead><tbody>${body}${tot}</tbody></table>`;
}

// Layout A: every day is a full block, like Finance's own Daily report repeated
function dayBlocks(d, rows, o = {}) {
  const { both = true, forCol = false, onlyDays = null } = o;
  return byDay(rows).filter(({ day }) => !onlyDays || onlyDays.includes(day)).map(({ day, rows: rs }) => `<div class="blk"><div class="bh">${wmd(day)}<span>· ${p(cnt(rs))} · net ${money(sum(rs))}</span></div>${dayLines(d, rs, both, forCol)}</div>`).join('');
}

function pageHead(d, o) {
  const { back, title = 'Money report', sub, print = true } = o;
  const btns = d === 'ph' || d === 'sm'
    ? `<span class="ibtn plain"><i class="ti ti-dots"></i></span>`
    : `<span class="btn q"><i class="ti ti-download"></i>Download CSV</span><span class="btn"><i class="ti ti-printer"></i>Print</span>`;
  return `<div class="bk"><i class="ti ti-arrow-left"></i>${back}</div><div class="pagehead"><div><h1 class="ptitle">${title}</h1><div class="ph-sub">${sub}</div></div><span class="grow"></span>${print ? btns : ''}</div>`;
}

function report(d, o) {
  const { rows, both = true, layout = 'B', open, forCol = false, back, sub, title, header = '' } = o;
  return pageHead(d, { back, title, sub }) + header + cards(rows) + (both ? `<div class="lbl" style="margin-top:4px">By school</div>${schoolBoxes(rows)}` : '') +
    `<div class="lbl">By day</div>` + (layout === 'B' ? dayTable(d, rows, { both, open, forCol }) : dayBlocks(d, rows, { both, forCol }));
}

// ===================== sample data =====================
const R = (day, t, name, school, m, amt, by = 'Staff', extra = {}) => ({ day, t, name, school, m, amt, by, state: 'counted', what: '', ...extra });
const CAMP = [
  R('2027-03-25', '10:12 AM', 'Ava Thompson', 'Worcester', 'Card', 335, 'Jeffrey'),
  R('2027-03-25', '11:40 AM', 'Emma Garcia', 'Shrewsbury', 'Cash', 335),
  R('2027-03-29', '9:05 AM', 'Isla Moore', 'Worcester', 'Check', 219),
  R('2027-04-02', '10:30 AM', 'Jack Murphy', 'Worcester', 'Card', 335, 'Jeffrey'),
  R('2027-04-02', '12:15 PM', 'Leo Kim', 'Shrewsbury', 'Cash', 320),
  R('2027-04-02', '12:20 PM', 'Noah Reyes', 'Worcester', 'Cash', 335, 'Staff', { state: 'undone' }),
  R('2027-04-12', '9:48 AM', 'Liam Ortiz', 'Shrewsbury', 'Check', 335),
  R('2027-04-12', '4:02 PM', 'Zoe Patel', 'Shrewsbury', 'Card', 300, 'Staff', { state: 'edited', was: 335 }),
  R('2027-04-19', '8:50 AM', 'Mia Rossi', 'Worcester', 'Cash', 166),
  R('2027-04-19', '3:10 PM', 'Emma Garcia', 'Shrewsbury', 'Cash', -100, 'Jeffrey'),
];
const STAR = [
  R('2026-11-02', '4:20 PM', 'Ben Alvarez', 'Worcester', 'Cash', 140),
  R('2026-11-02', '4:45 PM', 'Chloe Nguyen', 'Shrewsbury', 'Check', 140),
  R('2026-11-05', '5:10 PM', 'Dylan Park', 'Worcester', 'Card', 140, 'Jeffrey'),
  R('2026-11-05', '5:30 PM', 'Ella Brooks', 'Shrewsbury', 'Cash', 140),
  R('2026-11-14', '9:25 AM', 'Finn Walsh', 'Worcester', 'Check', 120, 'Staff', { state: 'edited', was: 140 }),
  R('2026-11-14', '9:05 AM', 'Grace Silva', 'Shrewsbury', 'Cash', 140),
  R('2026-11-14', '9:12 AM', 'Hugo Chen', 'Worcester', 'Card', 140, 'Jeffrey'),
  R('2026-11-14', '9:40 AM', 'Ivy Kim', 'Worcester', 'Cash', 140, 'Staff', { state: 'undone' }),
  R('2026-11-16', '10:15 AM', 'Dylan Park', 'Worcester', 'Card', -140, 'Jeffrey'),
];
const PRIV = [
  R('2026-11-04', '5:05 PM', 'Maya Ross', 'Worcester', 'Cash', 95, 'Staff', { what: 'Private test · Nov 12' }),
  R('2026-11-04', '5:20 PM', 'Owen Price', 'Worcester', 'Check', 95, 'Staff', { what: 'Private test · Nov 12' }),
  R('2026-11-10', '4:40 PM', 'Nina Cho', 'Worcester', 'Card', 110, 'Jeffrey', { what: 'Private test · Nov 19' }),
  R('2026-11-17', '6:10 PM', 'Theo Grant', 'Worcester', 'Cash', 95, 'Staff', { what: 'Private test · Nov 24' }),
  R('2026-11-17', '6:25 PM', 'Maya Ross', 'Worcester', 'Cash', -95, 'Jeffrey', { what: 'Private test · Nov 12' }),
];

// ===================== screens =====================
const SCREENS = [];
const S = (id, title, explain, render) => SCREENS.push({ id, title, explain, render });

// ---- ER1 ----
function campHead(d, o = {}) {
  const { button = false, hidden = false } = o;
  const b = button ? '<span class="btn q"><i class="ti ti-report-money"></i>Money report</span>' : '';
  return `<div class="bk"><i class="ti ti-arrow-left"></i>Camps</div><div class="pagehead"><div><h1 class="ptitle">April Vacation Camp <span class="tag neutral" style="font-weight:400;vertical-align:middle">Not open yet</span></h1><div class="ph-sub">Mon, Apr 19 – Fri, Apr 23, 2027 · 9:00 AM – 3:00 PM · Both schools · 9 campers</div></div><span class="grow"></span>${b}<span class="btn">Fill in</span><span class="btn btn-primary"><i class="ti ti-qrcode"></i>Registration link</span><span class="ibtn plain"><i class="ti ti-dots"></i></span></div>
