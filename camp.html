<!doctype html>
<!--
  camp.html — the public camp sign-up page (/camp/<code>).
  Why it exists: families open a camp's link or QR code from the school to sign up 1–3 children
  (contract 0013 §4.1). It is a third page in the same Vite build as the staff dashboard
  (index.html) and the Color Belt form (register.html) but shares none of the dashboard's code;
  React draws the form inside the empty <div id="root"> below, starting from src/camp/main.jsx.
  public/_redirects serves this page for every /camp/<code> address, and public/_headers gives
  it the same strict security policy as the Color Belt form.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Camp sign-up</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/camp/main.jsx"></script>
  </body>
</html>
